<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alice · Mending Workshop</title>
  <script>
    // Older portfolio bookmarks sometimes point to a particular Textile Studio exhibit.
    const toolkitSections = ['workflow', 'cushion', 'materials', 'cases', 'delivery', 'bridge', 'development', 'works', 'trial', 'results'];
    const section = location.hash.slice(1);
    const toolkit = toolkitSections.includes(section) || /^(work-|case-|cushion-)/.test(section);
    location.replace((toolkit ? 'toolkit.html' : 'game.html') + location.search + location.hash);
  </script>
</head>
<body>
  <a href="game.html">Alice · Mending Workshop</a>
</body>
</html>
