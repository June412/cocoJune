<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Alice Textile Studio 布艺工具。跟随八步制作植物抱枕，比较贴布与珠串的局部修改，浏览作品和 Unity 实测结果。"><meta name="theme-color" content="#ffffff"><title>Textile Studio</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css?v=8b9163fa1f"><link rel="stylesheet" href="chapters.css?v=ce520fa09c"><link rel="stylesheet" href="sequences.css?v=2284e127ee"><script defer src="sequences.js?v=c36dc31960"></script><script defer src="media.js?v=1b23d07beb"></script><link rel="stylesheet" href="material-orbit.css?v=b9c75a23bd"><script defer src="material-orbit.js?v=a7e6198545"></script><link rel="stylesheet" href="image-inspection.css?v=1cd865f506"><script defer src="image-inspection.js?v=10277dbf3d"></script><link rel="stylesheet" href="tool-story.css?v=be3b43abaf"><script defer src="tool-story.js?v=a0e1e71d49"></script><link rel="stylesheet" href="workbench-guide.css?v=dd8d9b4295"><script defer src="workbench-guide.js?v=7f63dc60f0"></script><link rel="stylesheet" href="workshop-props.css?v=f1e038a261"><script defer src="workshop-props.js?v=16b5ad19fb"></script><link rel="stylesheet" href="admissions-film.css?v=17c276a685"><script defer src="admissions-film.js?v=cdb336d96d"></script><link rel="stylesheet" href="browse-arrows.css?v=f940c750ed"><script defer src="browse-arrows.js?v=2f2f84669c"></script><script defer src="../../thread-rail/reader.js?v=9c3dffe5e4"></script><script defer src="../../styles/project-translation.js?v=904d5234a3"></script><script defer src="toolkit-notes-zh.js?v=f1fe789f26"></script><script defer src="app.js?v=248a526075"></script><link rel="stylesheet" href="personal-theme.css?v=5d0c3f97fb"><link rel="stylesheet" href="personal-shell.css?v=972c52c988"><link rel="stylesheet" href="personal-media.css"><link rel="stylesheet" href="personal-toolkit-layout.css?v=cb7e44e5ef"><link rel="stylesheet" href="personal-figures.css"><link rel="stylesheet" href="gallery-silhouettes.css"><link rel="stylesheet" href="personal-tool-cutouts.css"><link rel="stylesheet" href="../../thread-rail/reader.css?v=aac8f26fb5"><link rel="stylesheet" href="../../styles/project-annotations.css?v=197b3169b0"></head><body class="personal-alice" data-page="toolkit"><template id="report-source"><details id="report-overview"><summary>Overview</summary><div class="grid hero"><header class="report-heading"><p class="lead">A Unity authoring toolkit for fabric surfaces, stitches and sewn accessories. It turns textile construction into editable parameters and reusable assets.</p></header><figure class="figure " data-media="cushionComplete"><div class="picture"><button aria-label="Enlarge: Botanical cushion: woven base, felt appliqué, satin embroidery, blanket edging and fabric binding." data-story-image="assets/a2481c705501d5.webp" data-caption="Botanical cushion: woven base, felt appliqué, satin embroidery, blanket edging and fabric binding."><img src="assets/a2481c705501d5.webp" width="1800" height="1500" alt="Botanical cushion: woven base, felt appliqué, satin embroidery, blanket edging and fabric binding." loading="lazy"></button></div><figcaption>Botanical cushion: woven base, felt appliqué, satin embroidery, blanket edging and fabric binding.</figcaption></figure><div class="stack"><p class="">The tool grew from the repeated textile work in <em>Alice · Mending Workshop</em>: a single material could describe cloth, but could not describe a folded edge, a thread passing through a hole or a layered patch. The Studio separates these jobs while keeping them on the same working model.</p><p class=""><strong>Technical art scope.</strong> Procedural fabric shading, surface projection, thread and accessory geometry, editor workflows, reusable authoring data and independent asset delivery.</p><p class=""><strong>Current tool.</strong> Alice Textile Studio 1.0.1, with a three-pane workbench, English and Chinese interfaces, model import, editable layers, presentation controls and static Unity / OBJ output.</p><p class="">The Toolkit produces visual assets. The game supplies the repair rules, input, collision, animation and persistence. Five workshop props demonstrate this connection in a running scene.</p><div class="inline-links"><a href="game.html#doll">Game integration →</a><a href="#overview">Full work archive →</a></div></div></div></details>
<details id="report-design"><summary id="report-heading-design">Design</summary><div class="grid two"><div class="stack"><div class=""><h3>Authoring Model</h3><p class="">Fabric appearance, surface craft and reusable parts have different editing requirements. Fabric controls operate on selected material regions; stitches and patches retain their own paths; buttons, beads and ribbons retain their dimensions and fastening settings. This prevents a broad material operation from overwriting unrelated attachments.</p><div class="flow" style="--steps:3"><div><b>Surface</b><span>Select a renderer, material slot or triangle region.</span></div><div><b>Recipe</b><span>Store fabric parameters, paths, normals and craft settings.</span></div><div><b>Geometry</b><span>Rebuild the changed layer while preserving editable input.</span></div></div><p class="">Imported Models and Prefabs become independent static working copies. A skinned model is baked in its current pose; an LOD group uses its first non-empty level. Source meshes and materials remain separate from the working asset.</p></div><div class=""><h3>Selection &amp; Recovery</h3><p class="">The Suzanne review exposed an ambiguous operation: changing the body fabric also affected small accessories. Explicit working regions and separate craft layers made the scope visible. Subsequent checks covered accessory isolation, root rotation, appearance A/B, exports and restoration after a domain reload.</p><p class="">Freehand strokes finish on release; point drawing finishes with Enter. Stored drafts, editable control points, lock states and Undo / Redo let the user revise a construction without redrawing the model.</p></div><div class="screens two complete-objects"><figure class="figure " data-media="work:suzanne-02-look-a"><div class="picture"><button aria-label="Enlarge: Suzanne: knit appearance with separate accessories." data-story-image="assets/bffb7a48e629d9.webp" data-caption="Suzanne: knit appearance with separate accessories."><img src="assets/bffb7a48e629d9.webp" width="1400" height="1100" alt="Suzanne: knit appearance with separate accessories." loading="lazy"></button></div><figcaption>Suzanne: knit appearance with separate accessories.</figcaption></figure><figure class="figure " data-media="work:suzanne-04-look-b"><div class="picture"><button aria-label="Enlarge: A second Look on the same prepared model." data-story-image="assets/3c9b47f87caf86.webp" data-caption="A second Look on the same prepared model."><img src="assets/3c9b47f87caf86.webp" width="1400" height="1100" alt="A second Look on the same prepared model." loading="lazy"></button></div><figcaption>A second Look on the same prepared model.</figcaption></figure></div></div><div class="stack"><figure class="figure " data-media="workbenchEn"><div class="picture"><button aria-label="Enlarge: The Edging tool draws the binding around the outside of the cushion." data-story-image="assets/botanical-workbench-library.webp" data-caption="The Edging tool draws the binding around the outside of the cushion."><img src="assets/botanical-workbench-library.webp" width="1920" height="1142" alt="The Edging tool draws the binding around the outside of the cushion." loading="lazy"></button><span class="pin" style="left:16%;top:26%">1</span><span class="pin" style="left:62%;top:70%">2</span><span class="pin" style="left:96%;top:37%">3</span></div><figcaption>The Edging tool draws the binding around the outside of the cushion.</figcaption></figure><div class="annotations"><p class=""><b>1 · Library.</b> Choose the cushion binding preset in Edging.</p><p class=""><b>2 · Canvas.</b> Place points along the outer edge of the cushion.</p><p class=""><b>3 · Parameters.</b> The outline is closed and the binding is 4.5 mm wide.</p></div></div></div><section class="evidence"><h3>Implementation notes</h3><ul><li>AliceToolkitAuthoring.cs: static input copies and material isolation.</li><li>AliceToolkitWindow / Workbench: working regions, drawing modes and contextual controls.</li><li>ToolkitUsabilityReview: 33 checks across selection, editing, recovery and appearance transfer.</li></ul></section></details>
<details id="report-workflow"><summary id="report-heading-workflow">Workflow</summary><p class="">One cushion carries the full workflow. Its dimensions are 320 × 280 × 65 mm. A 156 × 194 mm felt patch contains a stem and five satin leaves; a separate fabric binding follows the outer cushion perimeter. Each step below pairs the native control with the resulting construction.</p><div class="flow" style="--steps:4"><div><b>Import &amp; scale</b><span>Create a working copy; check dimensions in millimetres.</span></div><div><b>Fabric &amp; patch</b><span>Choose the base weave and draw a closed felt outline.</span></div><div><b>Embroidery &amp; edge</b><span>Set fill direction, thread dimensions and edge spacing.</span></div><div><b>Layers &amp; output</b><span>Bind dependent layers, save editable work and export a static copy.</span></div></div><div class="grid two"><div class=""><h3>Surface</h3><div class="controls-result"><figure class="figure panel" data-media="uiFabricDetail"><div class="picture"><button aria-label="Enlarge: Fabric controls for the selected cushion surface." data-story-image="assets/a0c715023afd9c.webp" data-caption="Fabric controls for the selected cushion surface."><img src="assets/a0c715023afd9c.webp" width="671" height="897" alt="Fabric controls for the selected cushion surface." loading="lazy"></button></div><figcaption>Fabric controls for the selected cushion surface.</figcaption></figure><div class="stack"><figure class="figure " data-media="cushionBase"><div class="picture"><button aria-label="Enlarge: Base fabric before any appliqué or embroidery." data-story-image="assets/8b0abfd5c9c1bc.webp" data-caption="Base fabric before any appliqué or embroidery."><img src="assets/8b0abfd5c9c1bc.webp" width="1800" height="1500" alt="Base fabric before any appliqué or embroidery." loading="lazy"></button></div><figcaption>Base fabric before any appliqué or embroidery.</figcaption></figure><p class="">Import or drag a model into the workbench, choose its working surface and calibrate its physical size. Select a fabric family, then adjust weave size and direction. Scale is shared by the material and millimetre-based craft dimensions.</p><p class="">Object-space projection supports models without a dedicated textile UV layout. Calibrated UV mapping provides deliberate direction where usable UVs exist. A poor UV layout still requires preparation.</p></div></div></div><div class=""><h3>Patchwork</h3><div class="controls-result"><figure class="figure panel" data-media="uiPatchDetail"><div class="picture"><button aria-label="Enlarge: Wool felt, 1.4 mm thickness and 0.6 mm weave size." data-story-image="assets/6738700ec1f895.webp" data-caption="Wool felt, 1.4 mm thickness and 0.6 mm weave size."><img src="assets/6738700ec1f895.webp" width="671" height="1422" alt="Wool felt, 1.4 mm thickness and 0.6 mm weave size." loading="lazy"></button></div><figcaption>Wool felt, 1.4 mm thickness and 0.6 mm weave size.</figcaption></figure><div class="stack"><figure class="figure " data-media="cushionPatch"><div class="picture"><button aria-label="Enlarge: Closed felt patch with a separate blanket seam." data-story-image="assets/ceb4842905f018.webp" data-caption="Closed felt patch with a separate blanket seam."><img src="assets/ceb4842905f018.webp" width="1800" height="1500" alt="Closed felt patch with a separate blanket seam." loading="lazy"></button></div><figcaption>Closed felt patch with a separate blanket seam.</figcaption></figure><p class="">Draw a closed outline, then select Wool felt and set its thickness. The outline remains editable. Split tools and edge snapping support adjacent patches; shared seams are rebuilt when their boundaries change.</p><p class="">This case uses a separate blanket layer: 4.5 mm stitch spacing, 2.5 mm width and 0.48 mm thread diameter. Keeping it separate allows the seam to be edited independently.</p></div></div></div></div><div class="grid two subsection"><div class=""><h3>Embroidery</h3><div class="controls-result"><figure class="figure panel" data-media="uiLeafDetail"><div class="picture"><button aria-label="Enlarge: Satin leaf 3: 0.6 mm spacing, 0.54 mm thread diameter, 58° fill direction." data-story-image="assets/252f6417a6aac6.webp" data-caption="Satin leaf 3: 0.6 mm spacing, 0.54 mm thread diameter, 58° fill direction."><img src="assets/252f6417a6aac6.webp" width="671" height="1259" alt="Satin leaf 3: 0.6 mm spacing, 0.54 mm thread diameter, 58° fill direction." loading="lazy"></button></div><figcaption>Satin leaf 3: 0.6 mm spacing, 0.54 mm thread diameter, 58° fill direction.</figcaption></figure><div class="stack"><figure class="figure " data-media="cushionLeafDetail"><div class="picture"><button aria-label="Enlarge: Satin threads fill the leaf while the stem follows an open path." data-story-image="assets/29efcca4ae2879.webp" data-caption="Satin threads fill the leaf while the stem follows an open path."><img src="assets/29efcca4ae2879.webp" width="1800" height="1500" alt="Satin threads fill the leaf while the stem follows an open path." loading="lazy"></button></div><figcaption>Satin threads fill the leaf while the stem follows an open path.</figcaption></figure><p class="">A closed leaf defines the embroidery region. Fill direction establishes the grain of the stitching; spacing controls coverage and thread diameter controls its relief. The middle leaf is selected for a clear, repeatable parameter example.</p><p class="">The stem, five leaves and blanket edging are bound to the felt patch. Their local offsets are measured above its surface, so changing patch thickness does not leave them buried inside it.</p></div></div></div><div class=""><h3>Finishing</h3><div class="controls-result"><figure class="figure panel" data-media="uiLayerDetail"><div class="picture"><button aria-label="Enlarge: Nine editable layers, including the patch and its dependent craft." data-story-image="assets/3b47407f137895.webp" data-caption="Nine editable layers, including the patch and its dependent craft."><img src="assets/3b47407f137895.webp" width="599" height="933" alt="Nine editable layers, including the patch and its dependent craft." loading="lazy"></button></div><figcaption>Nine editable layers, including the patch and its dependent craft.</figcaption></figure><div class="stack"><div class="screens two"><figure class="figure " data-media="cushionEdgeDetail"><div class="picture"><button aria-label="Enlarge: Blanket stitching around the felt patch." data-story-image="assets/e91aacd145d0e0.webp" data-caption="Blanket stitching around the felt patch."><img src="assets/e91aacd145d0e0.webp" width="1800" height="1500" alt="Blanket stitching around the felt patch." loading="lazy"></button></div><figcaption>Blanket stitching around the felt patch.</figcaption></figure><figure class="figure " data-media="cushionBindingDetail"><div class="picture"><button aria-label="Enlarge: Separate outer fabric binding: 4.5 mm wide and 1 mm thick." data-story-image="assets/5c08fd89674324.webp" data-caption="Separate outer fabric binding: 4.5 mm wide and 1 mm thick."><img src="assets/5c08fd89674324.webp" width="1800" height="1500" alt="Separate outer fabric binding: 4.5 mm wide and 1 mm thick." loading="lazy"></button></div><figcaption>Separate outer fabric binding: 4.5 mm wide and 1 mm thick.</figcaption></figure></div><p class="">Select, rename, hide, lock, duplicate, group or align layers without flattening the construction. The outer binding remains on the original cushion surface; it does not follow the decorative patch.</p><p class="">Save the working model and its authoring data before delivery. A Look stores the complete appearance; a Motif stores a local group. Static export produces a separate mesh-and-material asset for a receiving project.</p></div></div></div></div><section class="evidence"><h3>Implementation notes</h3><ul><li>PortfolioVerticalReview-20261113: corrected Wool felt family metadata; nine layers and seven patch bindings.</li><li>Attachment check: a 12 mm patch translation moved the sampled leaf control point by approximately 12 mm.</li><li>AlicePatchAttachments.cs: polygon weights, height propagation, surface reprojection and cyclic-dependency rejection.</li></ul></section></details>
<details id="report-technical-art"><summary id="report-heading-technical-art">Technical Art</summary><div class="grid two"><div class=""><h3>Fabric Shading</h3><p class="">The common authoring fabric shader combines original colour and normal textures with a procedural weave. Mapping and weave direction define the pattern; derivative filtering reduces fine pattern contrast as the cell becomes smaller than a screen pixel.</p><div class="flow" style="--steps:3"><div><b>Coordinates</b><span>Object-space triplanar or calibrated UV mapping.</span></div><div><b>Weave</b><span>A filtered pattern supplies colour variation and height.</span></div><div><b>Lighting</b><span>Height gradients adjust normals; fibre sheen and directional reflection shape the response.</span></div></div><p class="">Micro-relief changes the shading normal rather than the mesh silhouette. Height derivatives are limited at degenerate or grazing views. The final pass combines direct and additional lights, shadows, occlusion and environment lighting.</p><pre class="code"><code>float2 width = max(fwidth(p), 0.0001);
float2 visibility = 1.0 - smoothstep(0.20, 0.85, width);
float2 wave = sin(p * tau) * visibility;</code></pre><p class="source">FilteredWeave excerpt · AliceAuthoringFabric.shader</p><pre class="code"><code>float height = weave.x * _ReliefMeters * objectScale;
float3 dx = ddx(input.positionWS), dy = ddy(input.positionWS);
float3 crossY = cross(dy,n), crossX = cross(n,dx);
float determinant = dot(dx,crossY);
float3 gradient = sign(determinant) *
    (ddx(height)*crossY + ddy(height)*crossX) /
    max(abs(determinant),0.00000001);
gradient *= min(1.0, .65 / max(length(gradient), .0001));
n = normalize(n - gradient);</code></pre><p class="source">FabricSurface excerpt · bounded micro-relief gradient</p></div><div class=""><h3>Controlled Comparison</h3><div class="screens two"><figure class="figure " data-media="shaderBase"><div class="picture"><button aria-label="Enlarge: Base: weave contrast, relief and sheen disabled." data-story-image="assets/a9579f33b90d1f.webp" data-caption="Base: weave contrast, relief and sheen disabled."><img src="assets/a9579f33b90d1f.webp" width="1800" height="1500" alt="Base: weave contrast, relief and sheen disabled." loading="lazy"></button></div><figcaption>Base: weave contrast, relief and sheen disabled.</figcaption></figure><figure class="figure " data-media="shaderWeave"><div class="picture"><button aria-label="Enlarge: Weave: colour modulation enabled." data-story-image="assets/23c496a47c3768.webp" data-caption="Weave: colour modulation enabled."><img src="assets/23c496a47c3768.webp" width="1800" height="1500" alt="Weave: colour modulation enabled." loading="lazy"></button></div><figcaption>Weave: colour modulation enabled.</figcaption></figure><figure class="figure " data-media="shaderNormal"><div class="picture"><button aria-label="Enlarge: Relief: height-gradient normal enabled." data-story-image="assets/c18021c6ff9c11.webp" data-caption="Relief: height-gradient normal enabled."><img src="assets/c18021c6ff9c11.webp" width="1800" height="1500" alt="Relief: height-gradient normal enabled." loading="lazy"></button></div><figcaption>Relief: height-gradient normal enabled.</figcaption></figure><figure class="figure " data-media="shaderFinal"><div class="picture"><button aria-label="Enlarge: Final: fibre sheen and reflection enabled." data-story-image="assets/e1b71634c8b735.webp" data-caption="Final: fibre sheen and reflection enabled."><img src="assets/e1b71634c8b735.webp" width="1800" height="1500" alt="Final: fibre sheen and reflection enabled." loading="lazy"></button></div><figcaption>Final: fibre sheen and reflection enabled.</figcaption></figure></div><p class="">The same cushion region, light and camera are used in all four renders. Only the listed material contributions change. The comparison isolates shading from geometry and scene lighting.</p></div></div><div class="screens eight squares subsection material-originals"><figure class="figure " data-media="mat:M01_FinePlainCotton"><div class="picture"><button aria-label="Enlarge: Cotton" data-story-image="assets/472fb9bd335ed4.webp" data-caption="Cotton"><img src="assets/472fb9bd335ed4.webp" width="384" height="384" alt="Cotton" loading="lazy"></button></div><figcaption>Cotton</figcaption></figure><figure class="figure " data-media="mat:M02_CoarseLinen"><div class="picture"><button aria-label="Enlarge: Linen" data-story-image="assets/d490d97f984b6c.webp" data-caption="Linen"><img src="assets/d490d97f984b6c.webp" width="384" height="384" alt="Linen" loading="lazy"></button></div><figcaption>Linen</figcaption></figure><figure class="figure " data-media="mat:M03_JerseyKnit"><div class="picture"><button aria-label="Enlarge: Jersey" data-story-image="assets/73a475a3a00dff.webp" data-caption="Jersey"><img src="assets/73a475a3a00dff.webp" width="384" height="384" alt="Jersey" loading="lazy"></button></div><figcaption>Jersey</figcaption></figure><figure class="figure " data-media="mat:M04_RibKnit"><div class="picture"><button aria-label="Enlarge: Rib knit" data-story-image="assets/ef66fa403576d2.webp" data-caption="Rib knit"><img src="assets/ef66fa403576d2.webp" width="384" height="384" alt="Rib knit" loading="lazy"></button></div><figcaption>Rib knit</figcaption></figure><figure class="figure " data-media="mat:M05_BulkyYarn"><div class="picture"><button aria-label="Enlarge: Bulky yarn" data-story-image="assets/e465f66a35cb29.webp" data-caption="Bulky yarn"><img src="assets/e465f66a35cb29.webp" width="384" height="384" alt="Bulky yarn" loading="lazy"></button></div><figcaption>Bulky yarn</figcaption></figure><figure class="figure " data-media="mat:M06_Felt"><div class="picture"><button aria-label="Enlarge: Felt" data-story-image="assets/a489561914f30c.webp" data-caption="Felt"><img src="assets/a489561914f30c.webp" width="384" height="384" alt="Felt" loading="lazy"></button></div><figcaption>Felt</figcaption></figure><figure class="figure " data-media="mat:M07_ShortPile"><div class="picture"><button aria-label="Enlarge: Short pile" data-story-image="assets/d53cf1feeafc0e.webp" data-caption="Short pile"><img src="assets/d53cf1feeafc0e.webp" width="384" height="384" alt="Short pile" loading="lazy"></button></div><figcaption>Short pile</figcaption></figure><figure class="figure " data-media="mat:M08_Satin"><div class="picture"><button aria-label="Enlarge: Satin" data-story-image="assets/ad606896bccd5c.webp" data-caption="Satin"><img src="assets/ad606896bccd5c.webp" width="384" height="384" alt="Satin" loading="lazy"></button></div><figcaption>Satin</figcaption></figure></div><p class="small">Eight material families each provide three density presets. Their responses differ; the library includes specialised yarn and pile construction alongside the common fabric pipeline.</p><div class="grid two row-rule"><div class=""><h3>Surface Geometry</h3><figure class="diagram"><svg viewBox="0 0 720 240" role="img" aria-label="Curve sampling and projected stitch geometry"><defs><marker id="report-arrow-c" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#546e57"></path></marker></defs><path d="M20 184 Q160 95 363 156" fill="none" stroke="#a9b29e" stroke-width="24"></path><path d="M40 152 C110 90 170 105 235 130 S310 116 345 89" fill="none" stroke="#496548" stroke-width="3"></path><path d="M50 135 L145 102 L243 122 L337 78" fill="none" stroke="#9c7855" stroke-dasharray="4 5"></path><circle cx="52" cy="136" r="5" fill="#9c7855"></circle><circle cx="145" cy="102" r="5" fill="#9c7855"></circle><circle cx="243" cy="122" r="5" fill="#9c7855"></circle><circle cx="337" cy="78" r="5" fill="#9c7855"></circle><path d="M90 132L78 83M185 121L184 73M285 131L298 84" fill="none" stroke="#546e57" marker-end="url(#report-arrow-c)"></path><text x="22" y="24" class="label">Control points + surface normals</text><text x="22" y="220" class="small">Interpolate, project, then sample by arc length</text><path d="M385 112H421" stroke="#546e57" marker-end="url(#report-arrow-c)"></path><path d="M443 171 Q555 130 699 160" stroke="#a9b29e" stroke-width="22" fill="none"></path><path d="M453 162 Q467 111 488 153 M511 147 Q532 95 553 144 M575 144 Q598 96 621 147 M646 152 Q666 106 689 157" stroke="#8a6448" stroke-width="7" fill="none" stroke-linecap="round"></path><path d="M489 153L511 147M553 144L575 144M621 147L646 152" stroke="#8a6448" stroke-width="2" stroke-dasharray="3 4"></path><text x="439" y="24" class="label">Pitch + lift + thread radius</text><text x="448" y="220" class="small">Surface arches become a tube mesh</text></svg><figcaption>Construction diagram. The stored path and normals remain editable; the generated mesh is an output.</figcaption></figure><p class="">A dedicated mesh query finds the hit triangle and interpolates its smooth normal. Normals are transformed correctly under model scaling. Catmull–Rom samples are projected back to the selected surface before the curve is sampled by arc length.</p><p class="">Spacing determines needle intervals. Width and lift define the exposed arches; radius and quality determine their tube geometry. Cross stitches keep both strands separate. Off-surface projections are rejected instead of silently creating floating geometry.</p></div><div class=""><h3>Editable Dependencies</h3><div class="screens two"><figure class="figure " data-media="attachmentBefore"><div class="picture"><button aria-label="Enlarge: Before: seven dependent layers sit on the 1.4 mm felt patch." data-story-image="assets/c58e3e4793d1c7.webp" data-caption="Before: seven dependent layers sit on the 1.4 mm felt patch."><img src="assets/c58e3e4793d1c7.webp" width="1800" height="1500" alt="Before: seven dependent layers sit on the 1.4 mm felt patch." loading="lazy"></button></div><figcaption>Before: seven dependent layers sit on the 1.4 mm felt patch.</figcaption></figure><figure class="figure " data-media="attachmentAfter"><div class="picture"><button aria-label="Enlarge: After: the patch moves 12 mm and thickens to 3 mm; its craft follows." data-story-image="assets/944cc5ef0f8ed4.webp" data-caption="After: the patch moves 12 mm and thickens to 3 mm; its craft follows."><img src="assets/944cc5ef0f8ed4.webp" width="1800" height="1500" alt="After: the patch moves 12 mm and thickens to 3 mm; its craft follows." loading="lazy"></button></div><figcaption>After: the patch moves 12 mm and thickens to 3 mm; its craft follows.</figcaption></figure></div><p class="">A child stores weights relative to the patch boundary, its original surface data and its lift. When the patch changes, those weights recover a new position; the result is projected onto the working surface and rebuilt at the new height. A cycle or an invalid projection produces a recoverable error.</p><p class="">The generated mesh is not the sole source of truth. Paths, normals, fabric recipes and craft settings remain available for later edits, duplication, Undo and reuse.</p></div></div><div class="grid two row-rule"><div class=""><h3>Thread Quality</h3><div class="screens two"><figure class="figure " data-media="qualityClose"><div class="picture"><button aria-label="Enlarge: Close-up: twisted plies and fine surface structure." data-story-image="assets/e4c13aa0393241.webp" data-caption="Close-up: twisted plies and fine surface structure."><img src="assets/e4c13aa0393241.webp" width="1000" height="800" alt="Close-up: twisted plies and fine surface structure." loading="lazy"></button></div><figcaption>Close-up: twisted plies and fine surface structure.</figcaption></figure><figure class="figure " data-media="qualityGame"><div class="picture"><button aria-label="Enlarge: Game: a simpler thread tube on the same path." data-story-image="assets/de8ae70f494227.webp" data-caption="Game: a simpler thread tube on the same path."><img src="assets/de8ae70f494227.webp" width="1000" height="800" alt="Game: a simpler thread tube on the same path." loading="lazy"></button></div><figcaption>Game: a simpler thread tube on the same path.</figcaption></figure></div></div><div class=""><h3>Geometry Budget</h3><p class="">A controlled 15-stitch sample compares three manually selected quality levels. Close-up and Preview retain a three-ply construction; Game simplifies the tube. This is an authoring choice, not an automatic distance LOD.</p><div class="bars" role="img" aria-label="Vertices in the same 15-stitch sample: Close-up 87236, Preview 11928, Game 3240"><div class="bar"><span>Close-up</span><i style="--size:100%"></i><b>87,236</b></div><div class="bar"><span>Preview</span><i style="--size:13.67%"></i><b>11,928</b></div><div class="bar"><span>Game</span><i style="--size:3.71%"></i><b>3,240</b></div></div><p class="">The Game sample uses 96.3% fewer vertices than Close-up. These are mesh counts from one fixed sample; they do not establish a frame-rate claim.</p></div></div><section class="evidence"><h3>Implementation notes</h3><ul><li>AliceAuthoringFabric.shader: FilteredWeave, derivative micro-normal, cloth sheen and directional reflection.</li><li>AliceStitchMesh.cs / AliceThreadGeometry.cs: surface query, arc-length placement and quality-dependent geometry.</li><li>AliceSurfaceStitch.cs: editable path, normals, pitch, radius, width and lift.</li></ul></section></details>
<details id="report-craft-library"><summary id="report-heading-craft-library">Craft Library</summary><div class="grid two"><div class=""><h3>Stitches &amp; Fill</h3><div class="sample-layout"><figure class="figure " data-media="work:edging"><div class="picture"><button aria-label="Enlarge: Edging sampler: the same cloth boundary supports distinct stitch constructions." data-story-image="assets/0343f45c462551.webp" data-caption="Edging sampler: the same cloth boundary supports distinct stitch constructions."><img src="assets/0343f45c462551.webp" width="1200" height="1400" alt="Edging sampler: the same cloth boundary supports distinct stitch constructions." loading="lazy"></button></div><figcaption>Edging sampler: the same cloth boundary supports distinct stitch constructions.</figcaption></figure><div class="stack"><p class="">Running, back and cross stitches use editable open or closed paths. Border tools add piping, fabric binding, blanket, whip, chain, zigzag and extended blanket variations. The edging sampler makes stitch spacing, depth and edge coverage comparable.</p><p class="">Closed regions support Satin, Tatami, Cross, Seed and Long-short fills. The cushion uses Satin for a directional leaf; the house and clothing studies combine fills with appliqué so the region shape, thread direction and fabric layer can be adjusted separately.</p></div></div></div><div class=""><h3>Buttons, Sequins &amp; Beads</h3><div class="screens two"><figure class="figure " data-media="work:craft-10"><div class="picture"><button aria-label="Enlarge: Button and sequin material sampler." data-story-image="assets/f36ba94784a6d5.webp" data-caption="Button and sequin material sampler."><img src="assets/f36ba94784a6d5.webp" width="1600" height="1800" alt="Button and sequin material sampler." loading="lazy"></button></div><figcaption>Button and sequin material sampler.</figcaption></figure><figure class="figure " data-media="work:bead-heart"><div class="picture"><button aria-label="Enlarge: Sewn beadwork with a visible thread path." data-story-image="assets/e331f7e1a7c9e7.webp" data-caption="Sewn beadwork with a visible thread path."><img src="assets/e331f7e1a7c9e7.webp" width="1200" height="1000" alt="Sewn beadwork with a visible thread path." loading="lazy"></button></div><figcaption>Sewn beadwork with a visible thread path.</figcaption></figure></div><div class="table-wrap"><table><thead><tr><th scope="col">Part</th><th scope="col">Construction</th><th scope="col">Useful control</th></tr></thead><tbody><tr><td>Buttons</td><td>22 designs with modelled holes; thread enters the apertures.</td><td>Parallel, cross or square fastening; 1–6 passes.</td></tr><tr><td>Sequins</td><td>Six shapes, including a raised cup profile.</td><td>Two or three anchor directions; the thread clears the rim.</td></tr><tr><td>Beads</td><td>11 presets; a continuous line passes through real holes.</td><td>Path spacing, per-piece colours and thread diameter constrained by the hole.</td></tr></tbody></table></div><p class="">The material card compares attachment types on one surface. The bead heart adds a continuous path: bead placement, orientation and fastening are generated together rather than represented by a coloured texture.</p></div></div><div class="grid two row-rule"><div class=""><h3>Ribbon</h3><div class="screens two complete-objects"><figure class="figure " data-media="work:ribbon-0"><div class="picture"><button aria-label="Enlarge: Satin bow: knot, loops and two tails." data-story-image="assets/705d0edd01bdf5.webp" data-caption="Satin bow: knot, loops and two tails."><img src="assets/705d0edd01bdf5.webp" width="900" height="1000" alt="Satin bow: knot, loops and two tails." loading="lazy"></button></div><figcaption>Satin bow: knot, loops and two tails.</figcaption></figure><figure class="figure " data-media="work:ribbon-2"><div class="picture"><button aria-label="Enlarge: Rosette: repeated petals around a central knot." data-story-image="assets/7c68bcc0e9c3fd.webp" data-caption="Rosette: repeated petals around a central knot."><img src="assets/7c68bcc0e9c3fd.webp" width="900" height="1000" alt="Rosette: repeated petals around a central knot." loading="lazy"></button></div><figcaption>Rosette: repeated petals around a central knot.</figcaption></figure></div><p class="">The bow is generated from a centre knot, two folded loops and two tails. Width, thickness, fold depth and tail cuts change its construction. Rosettes expose 3–16 petals; material selection controls the contrast between satin and ribbed cloth.</p></div><div class=""><h3>Yarn</h3><div class="screens two complete-objects"><figure class="figure " data-media="work:craft-8"><div class="picture"><button aria-label="Enlarge: Yarn landscape combining pile and raised stitches." data-story-image="assets/39fab6d5f43acd.webp" data-caption="Yarn landscape combining pile and raised stitches."><img src="assets/39fab6d5f43acd.webp" width="1600" height="1800" alt="Yarn landscape combining pile and raised stitches." loading="lazy"></button></div><figcaption>Yarn landscape combining pile and raised stitches.</figcaption></figure><figure class="figure " data-media="work:motif-2"><div class="picture"><button aria-label="Enlarge: A reusable patch-and-embroidery motif." data-story-image="assets/43b7ef78f1d36b.webp" data-caption="A reusable patch-and-embroidery motif."><img src="assets/43b7ef78f1d36b.webp" width="640" height="480" alt="A reusable patch-and-embroidery motif." loading="lazy"></button></div><figcaption>A reusable patch-and-embroidery motif.</figcaption></figure></div><p class="">Pom-poms, cut pile, loop pile, French knots and chenille build volume above the surface. The landscape uses these forms to distinguish ground, vegetation and raised accents. Height and density are local parameters, so a dense detail can be revised without rebuilding the surrounding fabric.</p></div></div><div class="grid two row-rule"><div class=""><h3>Pattern Editor</h3><p class="">The pattern editor edits a colour grid: paint or erase cells, choose a palette, mirror or rotate the motif, then set its physical repeat size. It supplies a repeatable surface pattern; editing the grid does not require painting a new texture outside Unity.</p><div class="flow" style="--steps:3"><div><b>Cell grid</b><span>Paint, erase and organise the palette.</span></div><div><b>Repeat</b><span>Mirror or rotate; set the repeat in millimetres.</span></div><div><b>Fabric</b><span>Apply the pattern through the fabric material.</span></div></div><div class="controls-result pattern-case"><figure class="figure panel" data-media="patternInspector"><div class="picture"><button aria-label="Enlarge: Native palette, cell grid and repeat controls." data-story-image="assets/f2a85d31317847.webp" data-caption="Native palette, cell grid and repeat controls."><img src="assets/f2a85d31317847.webp" width="1040" height="1094" alt="Native palette, cell grid and repeat controls." loading="lazy"></button></div><figcaption>Native palette, cell grid and repeat controls.</figcaption></figure><div class="stack"><figure class="figure " data-media="patternResult"><div class="picture"><button aria-label="Enlarge: Flower pattern applied to the cushion at a 40 mm repeat." data-story-image="assets/ab0fce04f74609.webp" data-caption="Flower pattern applied to the cushion at a 40 mm repeat."><img src="assets/ab0fce04f74609.webp" width="1800" height="1500" alt="Flower pattern applied to the cushion at a 40 mm repeat." loading="lazy"></button></div><figcaption>Flower pattern applied to the cushion at a 40 mm repeat.</figcaption></figure><p class="">Paint or erase cells, generate a starting pattern, then mirror or rotate it before applying. The model stores an independent copy: after editing the grid, apply it again to update that model.</p></div></div></div><div class=""><h3>Pixel Loom</h3><div class="screens two"><figure class="figure " data-media="pixelSource"><div class="picture"><button aria-label="Enlarge: Stored source grid: 62 × 35 colour cells." data-story-image="assets/d4593df8a2a1a4.webp" data-caption="Stored source grid: 62 × 35 colour cells."><img src="assets/d4593df8a2a1a4.webp" width="992" height="560" alt="Stored source grid: 62 × 35 colour cells." loading="lazy"></button></div><figcaption>Stored source grid: 62 × 35 colour cells.</figcaption></figure><figure class="figure " data-media="work:reference-6"><div class="picture"><button aria-label="Enlarge: The same grid constructed as a glass-bead picture." data-story-image="assets/15be46f116ce44.webp" data-caption="The same grid constructed as a glass-bead picture."><img src="assets/15be46f116ce44.webp" width="1600" height="1000" alt="The same grid constructed as a glass-bead picture." loading="lazy"></button></div><figcaption>The same grid constructed as a glass-bead picture.</figcaption></figure></div><div class="flow" style="--steps:3"><div><b>Pixels</b><span>Retain the source grid and transparency.</span></div><div><b>Placement</b><span>Convert each cell to a loop or bead at the chosen pitch.</span></div><div><b>Batches</b><span>Group colours while retaining editable source data.</span></div></div><p class="">Pixel Loom converts an image grid into knitted loops or beads. Transparent cells are omitted. Colour grouping creates batches of at most 180 cells while preserving the original pixel array for later changes.</p><p class="">The sheep example contains 2,170 beads at 4.9 mm pitch. Grid resolution determines how much of the source image survives; pitch determines the physical size. The source image and the generated craft remain separate.</p></div></div><div class="grid two row-rule"><div class=""><h3>Wrinkles</h3><div class="screens two"><figure class="figure " data-media="wrinkleBefore"><div class="picture"><button aria-label="Enlarge: Before the local fold." data-story-image="assets/a7a7ad0317070e.webp" data-caption="Before the local fold."><img src="assets/a7a7ad0317070e.webp" width="1200" height="1000" alt="Before the local fold." loading="lazy"></button></div><figcaption>Before the local fold.</figcaption></figure><figure class="figure " data-media="wrinkleAfter"><div class="picture"><button aria-label="Enlarge: After deformation and attachment updates." data-story-image="assets/3011a9e3b22ce1.webp" data-caption="After deformation and attachment updates."><img src="assets/3011a9e3b22ce1.webp" width="1200" height="1000" alt="After deformation and attachment updates." loading="lazy"></button></div><figcaption>After deformation and attachment updates.</figcaption></figure></div><p class="">A wrinkle layer deforms a static working copy from an immutable baseline. Soft craft follows the changed surface; rigid accessories keep their shape and adjust their position and orientation. Bake the result before continuing with further construction. This is local asset authoring, rather than runtime cloth simulation.</p><div class="flow" style="--steps:3"><div><b>Baseline</b><span>Keep the original mesh for reversible edits.</span></div><div><b>Deform</b><span>Apply the local fold to the working copy.</span></div><div><b>Attachments</b><span>Reproject soft layers; reposition rigid parts.</span></div></div></div><div class=""><h3>Accessible Authoring</h3><p class="">The workbench offers 100%, 125% and 150% UI scale, click alternatives to continuous gestures, remappable controls, reduced motion and feedback history. Draft and confirmation states retain the same drawing rules while reducing the need for sustained dragging.</p><div class="target-example subsection"><div class="stack"><div class="flow" style="--steps:3"><div><b>Target</b><span>Mark a local position and radius.</span></div><div><b>Action</b><span>Assign an ID and action description.</span></div><div><b>Recheck</b><span>Review the geometry after edits.</span></div></div><pre class="code"><code>target: patch-inspection
role: Interactive
purpose: Surface
input: Click
radius: 6 mm</code></pre><p class="source">Cushion target · exported metadata</p></div><figure class="figure panel" data-media="toolkitAccessDetail"><div class="picture"><button aria-label="Enlarge: Input options and asset-target controls." data-story-image="assets/b32a092c856cb3.webp" data-caption="Input options and asset-target controls."><img src="assets/b32a092c856cb3.webp" width="668" height="864" alt="Input options and asset-target controls." loading="lazy"></button></div><figcaption>Input options and asset-target controls.</figcaption></figure></div><p class="">Asset targets describe intended interactions. The Unity export can include <code>accessibility.json</code> with those descriptions; the receiving game connects them to actual input, highlighting and state checks. Metadata alone does not implement gameplay.</p></div></div></details>
<details id="report-reuse-delivery"><summary id="report-heading-reuse-delivery">Reuse &amp; Delivery</summary><div class="grid two"><div class=""><h3>Reuse</h3><div class="table-wrap"><table><thead><tr><th scope="col">Format</th><th scope="col">Stored scope</th><th scope="col">Example</th></tr></thead><tbody><tr><td>Preset</td><td>One material recipe.</td><td>Reuse a cotton weave and its physical density.</td></tr><tr><td>Motif</td><td>A local group of editable craft layers.</td><td>Reproject a patch, stitches and accessories onto another surface.</td></tr><tr><td>Look</td><td>The complete prepared model appearance.</td><td>Restore region materials and its authored layer arrangement.</td></tr></tbody></table></div><div class="screens two"><figure class="figure " data-media="garden"><div class="picture"><button aria-label="Enlarge: Garden cushion with layered craft." data-story-image="assets/e70cff5184e725.webp" data-caption="Garden cushion with layered craft."><img src="assets/e70cff5184e725.webp" width="1440" height="1200" alt="Garden cushion with layered craft." loading="lazy"></button></div><figcaption>Garden cushion with layered craft.</figcaption></figure><figure class="figure " data-media="work:motif-transfer"><div class="picture"><button aria-label="Enlarge: A local garden motif transferred to another model." data-story-image="assets/17164ffe112903.webp" data-caption="A local garden motif transferred to another model."><img src="assets/17164ffe112903.webp" width="1440" height="1200" alt="A local garden motif transferred to another model." loading="lazy"></button></div><figcaption>A local garden motif transferred to another model.</figcaption></figure></div><p class="">A Motif transfers a local construction and keeps its layers editable after projection. A Look restores a prepared appearance. Cross-model material mapping is explicit; it does not imply that every ornament can be transferred automatically to an unrelated shape.</p></div><div class=""><h3>Presentation</h3><div class="controls-result"><figure class="figure panel" data-media="uiPresentationDetail"><div class="picture"><button aria-label="Enlarge: Native camera, lighting and output controls." data-story-image="assets/7aa3aab2e212ba.webp" data-caption="Native camera, lighting and output controls."><img src="assets/7aa3aab2e212ba.webp" width="671" height="1060" alt="Native camera, lighting and output controls." loading="lazy"></button></div><figcaption>Native camera, lighting and output controls.</figcaption></figure><div class="stack"><figure class="figure " data-media="cushionExport"><div class="picture"><button aria-label="Enlarge: Static cushion output, rendered from the delivery asset." data-story-image="assets/89a94f111a2367.webp" data-caption="Static cushion output, rendered from the delivery asset."><img src="assets/89a94f111a2367.webp" width="1800" height="1500" alt="Static cushion output, rendered from the delivery asset." loading="lazy"></button></div><figcaption>Static cushion output, rendered from the delivery asset.</figcaption></figure><p class="">Neutral, window, studio and macro views combine camera framing with lighting. Environment maps, shadows, grading, depth of field and contact occlusion are adjustable; A/B comparison retains a previous appearance for comparison.</p><p class="">PNG output supports 1,200, 1,600, 2,400 and 4,096 px with optional alpha. Editable work and the static production asset are separate deliverables.</p></div></div></div></div><div class="subsection"><h3>Export Pipeline</h3><div class="flow" style="--steps:4"><div><b>Working model</b><span>Editable paths, settings and source references.</span></div><div><b>Static copy</b><span>Meshes, materials, textures and local shader includes.</span></div><div><b>Dependency audit</b><span>Independent names and GUIDs; valid shader include paths.</span></div><div><b>Receiving project</b><span>Import the prefab and connect the required runtime systems.</span></div></div></div><div class="grid two"><div class="table-wrap"><table><thead><tr><th scope="col">Output</th><th scope="col">What it carries</th><th scope="col">Boundary</th></tr></thead><tbody><tr><td>Unity package</td><td>Static meshes, material settings, textures, local shaders and optional target metadata.</td><td>No authoring MonoBehaviours, bones or animation; render queues are retained.</td></tr><tr><td>OBJ</td><td>Geometry and basic colour materials.</td><td>Procedural Unity shading is not reproduced by OBJ.</td></tr><tr><td>Editable work</td><td>Prepared model, craft data, Looks and Motifs.</td><td>Used for continued authoring inside the Toolkit.</td></tr></tbody></table></div><div class="stack"><p class="">The export copies dependencies into an independent namespace. Local shader includes are rewritten with the export, and asset GUIDs are isolated to avoid collisions with another package. Dependencies are accepted only inside the export, Unity built-ins or installed Packages.</p><p class="">The workshop receives the work mat, organiser, handbook, curtain and Open sign. Its existing colliders, pivots, tool anchors and behaviour remain on the game side. Changing a cloth appearance therefore does not replace the interaction system.</p></div></div><div class="screens five subsection"><figure class="figure " data-media="gameMat"><div class="picture"><button aria-label="Enlarge: Work mat · repair surface and support height." data-story-image="assets/66d6ee3fc693a0.webp" data-caption="Work mat · repair surface and support height."><img src="assets/66d6ee3fc693a0.webp" width="1920" height="1200" alt="Work mat · repair surface and support height." loading="lazy"></button></div><figcaption>Work mat · repair surface and support height.</figcaption></figure><figure class="figure " data-media="gameOrganizer"><div class="picture"><button aria-label="Enlarge: Organiser · tool pickup anchors." data-story-image="assets/20936b12100fbe.webp" data-caption="Organiser · tool pickup anchors."><img src="assets/20936b12100fbe.webp" width="1920" height="1200" alt="Organiser · tool pickup anchors." loading="lazy"></button></div><figcaption>Organiser · tool pickup anchors.</figcaption></figure><figure class="figure " data-media="handbook"><div class="picture"><button aria-label="Enlarge: Handbook · opens the technique lessons." data-story-image="assets/cfcc50f02d59f9.webp" data-caption="Handbook · opens the technique lessons."><img src="assets/cfcc50f02d59f9.webp" width="1920" height="1200" alt="Handbook · opens the technique lessons." loading="lazy"></button></div><figcaption>Handbook · opens the technique lessons.</figcaption></figure><figure class="figure " data-media="gameCurtain"><div class="picture"><button aria-label="Enlarge: Curtain · fabric silhouette and edge seam." data-story-image="assets/11ff98e4353275.webp" data-caption="Curtain · fabric silhouette and edge seam."><img src="assets/11ff98e4353275.webp" width="1920" height="1200" alt="Curtain · fabric silhouette and edge seam." loading="lazy"></button></div><figcaption>Curtain · fabric silhouette and edge seam.</figcaption></figure><figure class="figure " data-media="gameSign"><div class="picture"><button aria-label="Enlarge: Open sign · take, hang and return actions." data-story-image="assets/cdfc1351462a47.webp" data-caption="Open sign · take, hang and return actions."><img src="assets/cdfc1351462a47.webp" width="1920" height="1200" alt="Open sign · take, hang and return actions." loading="lazy"></button></div><figcaption>Open sign · take, hang and return actions.</figcaption></figure></div><section class="evidence"><h3>Implementation notes</h3><ul><li>AliceToolkitExport.cs: mesh/material copies, local shader includes and dependency validation.</li><li>ToolkitIntegration: five workshop visual replacements preserve runtime interaction anchors.</li><li>Unity6Interop review: three separate exported assets were imported into a receiving Unity project.</li></ul></section></details>
<details id="report-validation"><summary id="report-heading-validation">Validation</summary><div class="grid two"><div class=""><h3>Iteration</h3><div class="table-wrap"><table><thead><tr><th scope="col">Problem</th><th scope="col">Change</th><th scope="col">Verification</th></tr></thead><tbody><tr><td>Ambiguous material scope</td><td>Explicit model regions and accessory isolation.</td><td>Suzanne selection, root rotation, domain reload and paired exports.</td></tr><tr><td>Thread readability and cost</td><td>Separated plies, controlled radius and three quality levels.</td><td>Fixed 15-stitch geometry comparison and matching close-ups.</td></tr><tr><td>Dependent layers losing alignment</td><td>Boundary weights, surface reprojection and height propagation.</td><td>The cushion patch translation and thickness example above.</td></tr><tr><td>Delivery tied to the authoring project</td><td>Copy assets and rewrite local shader dependencies.</td><td>Static prefab checks and imports into another project.</td></tr></tbody></table></div></div><div class=""><h3>Measured Scope</h3><p class="">A separate preview stress case reduced 1,001 source renderers to six preview renderers. Recorded editor drag times were 12.46 ms median / 46.22 ms P95; orbit times were 15.54 ms / 50.13 ms. These measurements describe that editor case and are separate from the 15-stitch mesh budget.</p><p class="">The installer checks version, destination, GUIDs and checksums and creates a backup. The user workspace sits outside the installed tool files. The 1.0.0 → 1.0.1 upgrade review checked that authored work survived the update.</p><p class="">Compatibility evidence covers macOS with Unity 6.3 / URP 17.3 and Unity 6.5 / URP 17.5. The current cushion reload retains all seven bindings and its felt family. Its exported prefab preserves the vertex count and contains no authoring scripts.</p></div></div><section class="evidence"><h3>Implementation notes</h3><ul><li>ToolkitUsabilityReview · user-facing authoring and recovery checks.</li><li>ReleaseAudit-20261105 · installation and package boundary.</li><li>ToolkitCompatibilityReview / finish-20261106 · upgrade preservation and compatibility.</li><li>PortfolioVerticalReview-20261113 · corrected cushion settings, dependent layers and native workbench captures.</li></ul></section><section class="archive"><h3>Additional work</h3><div class="archive-grid"><figure class="figure " data-media="work:reference-1"><div class="picture"><button aria-label="Enlarge: House embroidery on a cotton surface." data-story-image="assets/3f890670c1220c.webp" data-caption="House embroidery on a cotton surface."><img src="assets/3f890670c1220c.webp" width="1200" height="1400" alt="House embroidery on a cotton surface." loading="lazy"></button></div><figcaption>House embroidery on a cotton surface.</figcaption></figure><figure class="figure " data-media="work:reference-2"><div class="picture"><button aria-label="Enlarge: Clothesline appliqué and embroidery." data-story-image="assets/5a22956526d602.webp" data-caption="Clothesline appliqué and embroidery."><img src="assets/5a22956526d602.webp" width="1200" height="1400" alt="Clothesline appliqué and embroidery." loading="lazy"></button></div><figcaption>Clothesline appliqué and embroidery.</figcaption></figure><figure class="figure " data-media="work:reference-3"><div class="picture"><button aria-label="Enlarge: Felt lamp with cross edging." data-story-image="assets/bc887023c6156b.webp" data-caption="Felt lamp with cross edging."><img src="assets/bc887023c6156b.webp" width="1200" height="1400" alt="Felt lamp with cross edging." loading="lazy"></button></div><figcaption>Felt lamp with cross edging.</figcaption></figure><figure class="figure " data-media="work:reference-4"><div class="picture"><button aria-label="Enlarge: Knitted bag with sewn construction." data-story-image="assets/67d487a2fef679.webp" data-caption="Knitted bag with sewn construction."><img src="assets/67d487a2fef679.webp" width="1
