<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Alice 修补工坊。跟随 Alice 和熊猫的两份委托，在实录中看针脚、听工坊雨声，并了解玩家怎样获得操作提示。"><meta name="theme-color" content="#ffffff"><title>Alice · Mending Workshop</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css?v=8b9163fa1f"><link rel="stylesheet" href="chapters.css?v=ce520fa09c"><link rel="stylesheet" href="sequences.css?v=2284e127ee"><script defer src="sequences.js?v=d149bcd672"></script><script defer src="media.js?v=1b23d07beb"></script><link rel="stylesheet" href="doll-orbit.css?v=1a0b7449d9"><script defer src="doll-orbit.js?v=1bdf6356a7"></script><link rel="stylesheet" href="workshop.css?v=811afc1910"><script defer src="workshop-media.js?v=e2d678e0bf"></script><script defer src="workshop-cues.js?v=1bea9f7197"></script><link rel="stylesheet" href="image-inspection.css?v=1cd865f506"><script defer src="image-inspection.js?v=10277dbf3d"></script><link rel="stylesheet" href="game-story.css?v=588a1673ff"><script defer src="game-story.js?v=af9b877a0c"></script><link rel="stylesheet" href="workshop-props.css?v=f1e038a261"><script defer src="workshop-props.js?v=16b5ad19fb"></script><link rel="stylesheet" href="admissions-film.css?v=17c276a685"><script defer src="admissions-film.js?v=9ab0aad127"></script><link rel="stylesheet" href="browse-arrows.css?v=0356b7a1e2"><script defer src="browse-arrows.js?v=2f2f84669c"></script><script defer src="../../thread-rail/reader.js?v=01ab32f5a8"></script><script defer src="app.js?v=51e8b845b0"></script><link rel="stylesheet" href="personal-theme.css?v=6b312991c4"><link rel="stylesheet" href="personal-shell.css"><link rel="stylesheet" href="personal-media.css"><link rel="stylesheet" href="personal-game-layout.css"><link rel="stylesheet" href="personal-figures.css"><link rel="stylesheet" href="gallery-silhouettes.css"><link rel="stylesheet" href="personal-tool-cutouts.css"><link rel="stylesheet" href="../../thread-rail/reader.css?v=6ba6ff5da1"></head><body class="personal-alice" data-page="game"><template id="report-source"><details id="report-overview"><summary>Overview</summary><div class="grid hero"><header class="report-heading"><p class="lead">A single-player repair game set at a seated craft desk. Two commissions connect an owner’s request to the visible repair of a familiar toy.</p></header><figure class="figure " data-media="room"><div class="picture"><button aria-label="Enlarge: The seated workshop view. Opening, repair tools, reference material and parcel handling occupy distinct places." data-story-image="assets/a9969196f35131.webp" data-caption="The seated workshop view. Opening, repair tools, reference material and parcel handling occupy distinct places."><img src="assets/a9969196f35131.webp" width="1920" height="1200" alt="The seated workshop view. Opening, repair tools, reference material and parcel handling occupy distinct places." loading="lazy"></button><span class="pin" style="left:52%;top:48%">1</span><span class="pin" style="left:51%;top:87%">2</span><span class="pin" style="left:85%;top:52%">3</span><span class="pin" style="left:67%;top:71%">4</span><span class="pin" style="left:68%;top:45%">5</span></div><figcaption>The seated workshop view. Opening, repair tools, reference material and parcel handling occupy distinct places.</figcaption></figure><div class="stack"><p class="">Players inspect damage, prepare tools, restore the material and check the result before returning the parcel. Close views support precise handwork while the room keeps tools and reference material in a consistent location.</p><p class=""><strong>Game design scope.</strong> The commission loop, ordered craft tasks, technique guidance, constrained choices, gentle error recovery and character responses.</p><p class=""><strong>Technical art scope.</strong> Textile materials, repair geometry, live thread, deformation and attachment stability, local interaction highlights, lighting and runtime asset integration.</p><p class="">The game uses five props authored with Alice Textile Studio. The Toolkit handles their fabric and craft geometry; this project connects them to camera framing, tool pickup, tutorials, state and save restoration.</p><div class="inline-links"><a href="toolkit.html#report-reuse-delivery">Toolkit asset pipeline →</a><a href="#overview">Full game documentation →</a></div></div></div><div class="annotations"><p class=""><b>1 · Window &amp; sill.</b> Open the glass and shutters; hang the sign and receive parcels.</p><p class=""><b>2 · Work mat.</b> Inspect the doll and carry out the repair.</p><p class=""><b>3 · Organiser.</b> Pick up and return the physical tools.</p><p class=""><b>4 · Handbook.</b> Consult the stitch technique for the current task.</p><p class=""><b>5 · Pinned note.</b> Keep the owner’s request and repair checklist available.</p></div></details>
<details id="report-game-design"><summary id="report-heading-game-design">Game Design</summary><div class="flow" style="--steps:6"><div><b>Opening</b><span>Open the glass and shutters; hang the Open sign.</span></div><div><b>Delivery</b><span>Peel the parcel tape, unfold the box and read the letter.</span></div><div><b>Inspection</b><span>Identify the damage and pin the repair checklist.</span></div><div><b>Repair</b><span>Prepare the tool and complete the current craft action.</span></div><div><b>Response</b><span>Inspect the repaired parts, then view the character response.</span></div><div><b>Dispatch</b><span>Read the owner’s story, pack, seal and send the parcel.</span></div></div><div class="grid two"><div class=""><h3>Goals &amp; Decisions</h3><p class="">The player’s main task is to understand what is damaged and carry out a plausible order of repair. Filling precedes closure; stitches precede tension; a knot precedes the final trim. The next tool becomes relevant when the current material state is ready for it.</p><p class="">Choice exists inside that structure. Alice allows thread colour, a replacement button, two or four holes and a compatible fastening pattern. Panda asks for its original crown and cheek sequin to be retained. The commissions constrain what must be repaired while allowing local choices about its finish.</p><p class="">The workshop is a functional workspace. Tool selection returns attention to the organiser; close cameras bring a hole or fabric edge into view; the pinned note keeps the request accessible without turning every instruction into a permanent overlay.</p><div class="screens two"><figure class="figure " data-media="gameArrival"><div class="picture"><button aria-label="Enlarge: Parcel arrival: the request enters through the window." data-story-image="assets/b064141e8a85d2.webp" data-caption="Parcel arrival: the request enters through the window."><img src="assets/b064141e8a85d2.webp" width="1920" height="1080" alt="Parcel arrival: the request enters through the window." loading="lazy"></button></div><figcaption>Parcel arrival: the request enters through the window.</figcaption></figure><figure class="figure " data-media="aliceSend"><div class="picture"><button aria-label="Enlarge: Return: the repaired toy is packed and sent from the same sill." data-story-image="assets/da0879856a50c7.webp" data-caption="Return: the repaired toy is packed and sent from the same sill."><img src="assets/da0879856a50c7.webp" width="1920" height="1080" alt="Return: the repaired toy is packed and sent from the same sill." loading="lazy"></button></div><figcaption>Return: the repaired toy is packed and sent from the same sill.</figcaption></figure></div></div><div class=""><h3>Learning Progression</h3><div class="table-wrap"><table><thead><tr><th scope="col">Commission</th><th scope="col">Introduced</th><th scope="col">Reused / combined</th></tr></thead><tbody><tr><td>Alice</td><td>Fill and pack a tear; read the ladder-stitch lesson; thread a needle.</td><td>Stitch, tension, knot and trim, then apply the same preparation to a button.</td></tr><tr><td>Panda</td><td>Stabilise live loops, recover rows, reposition retained accessories.</td><td>Reuse filling and ladder closure; sew crown loops and a central-hole sequin; inspect three repairs.</td></tr></tbody></table></div><p class="">The handbook explains the technique, the commission note explains the current objective, and local feedback explains the next valid action. These three layers serve different reading needs. Reopening a note does not silently complete a lesson or prepare a tool.</p><div class="screens two"><figure class="figure " data-media="tutorial"><div class="picture"><button aria-label="Enlarge: Technique reference: the ladder-stitch handbook." data-story-image="assets/a4aaad4949a266.webp" data-caption="Technique reference: the ladder-stitch handbook."><img src="assets/a4aaad4949a266.webp" width="1920" height="1080" alt="Technique reference: the ladder-stitch handbook." loading="lazy"></button></div><figcaption>Technique reference: the ladder-stitch handbook.</figcaption></figure><figure class="figure " data-media="gameLetter"><div class="picture"><button aria-label="Enlarge: Commission reference: the owner’s letter and checklist." data-story-image="assets/03f3af940c88f1.webp" data-caption="Commission reference: the owner’s letter and checklist."><img src="assets/03f3af940c88f1.webp" width="1920" height="1080" alt="Commission reference: the owner’s letter and checklist." loading="lazy"></button></div><figcaption>Commission reference: the owner’s letter and checklist.</figcaption></figure></div><p class="">Further commission designs extend this progression through patchwork, darning, basting and backstitch before combining techniques. Those five designs remain proposals; Alice and Panda are the two implemented commissions.</p></div></div><div class="grid two row-rule"><div class=""><h3>ReStory</h3><figure class="figure " data-media="refRestory"><div class="picture"><button aria-label="Enlarge: ReStory: Chill Electronics Repairs · official product screenshot, © Mandragora." data-story-image="assets/cc3d3368fea12f.webp" data-caption="ReStory: Chill Electronics Repairs · official product screenshot, © Mandragora."><img src="assets/cc3d3368fea12f.webp" width="1920" height="1080" alt="ReStory: Chill Electronics Repairs · official product screenshot, © Mandragora." loading="lazy"></button></div><figcaption>ReStory: Chill Electronics Repairs · official product screenshot, © Mandragora.</figcaption></figure><p class="">ReStory connects repair work with the people who bring objects into the shop. Its dismantle–clean–replace–reassemble sequence provides a useful comparison for making the condition of an object determine the next action.</p><p class="">Alice applies that clarity to soft materials: inspect a tear, restore volume, close the cloth and secure the thread. Its craft depends on cloth edges, apertures and tension rather than interchangeable electronic parts.</p><p class="inline-links"><a href="https://store.steampowered.com/app/3812600/ReStory_Chill_Electronics_Repairs/">Official game description ↗</a></p></div><div class=""><h3>Assemble with Care</h3><figure class="figure " data-media="refAssemble"><div class="picture"><button aria-label="Enlarge: Assemble with Care · official product screenshot, © ustwo games." data-story-image="assets/166bde241e3a7a.webp" data-caption="Assemble with Care · official product screenshot, © ustwo games."><img src="assets/166bde241e3a7a.webp" width="1920" height="1080" alt="Assemble with Care · official product screenshot, © ustwo games." loading="lazy"></button></div><figcaption>Assemble with Care · official product screenshot, © ustwo games.</figcaption></figure><p class="">Assemble with Care, from the studio behind Monument Valley, links the repair of valued possessions to their owners’ lives. It provides a useful reference for letting the object carry narrative context.</p><p class="">Here, that context becomes a concrete repair requirement: preserve Alice’s smile and old ribbon, and reuse Panda’s crown and original sequin. The repaired toy responds before the parcel is returned, giving the material result a place in the story.</p><p class="inline-links"><a href="https://ustwogames.co.uk/our-games/assemble-with-care/">Official game description ↗</a></p></div></div></details>
<details id="report-commissions"><summary id="report-heading-commissions">Commissions</summary><div class="grid two"><div class=""><h3>Alice</h3><p class="">Mina is moving and facing a new school. Her request preserves the doll’s familiar smile and old ribbon while repairing the damaged eye area. The task joins three material problems: lost stuffing, an open cloth tear and a missing button eye.</p><div class="screens two"><figure class="figure " data-media="aliceDamage"><div class="picture"><button aria-label="Enlarge: Before: the eye-area tear exposes the stuffing." data-story-image="assets/4a333eebea1e63.webp" data-caption="Before: the eye-area tear exposes the stuffing."><img src="assets/4a333eebea1e63.webp" width="1920" height="1080" alt="Before: the eye-area tear exposes the stuffing." loading="lazy"></button></div><figcaption>Before: the eye-area tear exposes the stuffing.</figcaption></figure><figure class="figure " data-media="aliceComplete"><div class="picture"><button aria-label="Enlarge: After: the cloth is closed and the chosen button is secured." data-story-image="assets/35b8151e30edce.webp" data-caption="After: the cloth is closed and the chosen button is secured."><img src="assets/35b8151e30edce.webp" width="1920" height="1080" alt="After: the cloth is closed and the chosen button is secured." loading="lazy"></button></div><figcaption>After: the cloth is closed and the chosen button is secured.</figcaption></figure></div><div class="table-wrap"><table><thead><tr><th scope="col">Stage</th><th scope="col">Action and result</th></tr></thead><tbody><tr><td>Volume</td><td>Add four portions of cotton, then pack the filling. Packing redistributes existing volume.</td></tr><tr><td>Cloth</td><td>Read the lesson, choose thread and thread the needle; sew six ladder-stitch groups.</td></tr><tr><td>Finish</td><td>Cut the working tail, tension the seam, secure the knot and trim the remaining tail.</td></tr><tr><td>Eye</td><td>Choose a two- or four-hole button; sew four passes per hole pair, then finish and tug-test.</td></tr></tbody></table></div><div class="screens two"><figure class="figure " data-media="buttonTray"><div class="picture"><button aria-label="Enlarge: The replacement button is a player choice." data-story-image="assets/1101025dceb77e.webp" data-caption="The replacement button is a player choice."><img src="assets/1101025dceb77e.webp" width="1920" height="1080" alt="The replacement button is a player choice." loading="lazy"></button></div><figcaption>The replacement button is a player choice.</figcaption></figure><figure class="figure " data-media="aliceStory"><div class="picture"><button aria-label="Enlarge: The owner’s story follows the seated greeting." data-story-image="assets/56831e8673daa5.webp" data-caption="The owner’s story follows the seated greeting."><img src="assets/56831e8673daa5.webp" width="1920" height="1080" alt="The owner’s story follows the seated greeting." loading="lazy"></button></div><figcaption>The owner’s story follows the seated greeting.</figcaption></figure></div><p class="">The chosen eye can differ from the original black button. That difference records a deliberate repair choice. After inspection, Alice sits up and greets the player; the story appears after the response, and dispatch completes the commission.</p></div><div class=""><h3>Panda</h3><p class="">Panda belongs to a bakery birthday memory. Its damaged ear, loose crown and displaced cheek sequin each require a different treatment. The request keeps the old accessories, so the work centres on recovery and reattachment.</p><div class="screens two"><figure class="figure " data-media="pandaInspection"><div class="picture"><button aria-label="Enlarge: Before: inspect the damaged ear and retained accessories." data-story-image="assets/38876d91f91c68.webp" data-caption="Before: inspect the damaged ear and retained accessories."><img src="assets/38876d91f91c68.webp" width="1920" height="1080" alt="Before: inspect the damaged ear and retained accessories." loading="lazy"></button></div><figcaption>Before: inspect the damaged ear and retained accessories.</figcaption></figure><figure class="figure " data-media="pandaComplete"><div class="picture"><button aria-label="Enlarge: After: the repaired ear, original crown and cheek sequin." data-story-image="assets/93134f7896c5e6.webp" data-caption="After: the repaired ear, original crown and cheek sequin."><img src="assets/93134f7896c5e6.webp" width="1920" height="1080" alt="After: the repaired ear, original crown and cheek sequin." loading="lazy"></button></div><figcaption>After: the repaired ear, original crown and cheek sequin.</figcaption></figure></div><div class="table-wrap"><table><thead><tr><th scope="col">Stage</th><th scope="col">Action and result</th></tr></thead><tbody><tr><td>Ear</td><td>Stabilise two loop markers, recover six rows, add three cotton portions and make two packing presses.</td></tr><tr><td>Closure</td><td>Sew six ladder groups, tension the seam, secure two knots and trim the tail.</td></tr><tr><td>Crown</td><td>Lift and reposition the original crown; sew four attachment loops, secure two knots and tug-test.</td></tr><tr><td>Cheek</td><td>Position the original sequin; make three central-hole passes, secure two knots and trim.</td></tr></tbody></table></div><div class="screens two"><figure class="figure " data-media="pandaCrown"><div class="picture"><button aria-label="Enlarge: The original crown is sewn back in place." data-story-image="assets/a590286753f783.webp" data-caption="The original crown is sewn back in place."><img src="assets/a590286753f783.webp" width="1920" height="1080" alt="The original crown is sewn back in place." loading="lazy"></button></div><figcaption>The original crown is sewn back in place.</figcaption></figure><figure class="figure " data-media="pandaStory"><div class="picture"><button aria-label="Enlarge: The response and owner’s story follow all three inspections." data-story-image="assets/1bd6186c8b47ee.webp" data-caption="The response and owner’s story follow all three inspections."><img src="assets/1bd6186c8b47ee.webp" width="1920" height="1080" alt="The response and owner’s story follow all three inspections." loading="lazy"></button></div><figcaption>The response and owner’s story follow all three inspections.</figcaption></figure></div><p class="">Final inspection records three distinct repair points. Repeating one inspection cannot complete the others. Only after all three pass does Panda respond and move into the return-parcel sequence.</p></div></div></details>
<details id="report-interaction"><summary id="report-heading-interaction">Interaction</summary><div class="grid two"><div class=""><h3>Needle &amp; Surface</h3><div class="screens two"><figure class="figure " data-media="clothEntry"><div class="picture"><button aria-label="Enlarge: Entry pending: two passes are committed; the next exit is still required." data-story-image="assets/b964d820a08fe6.webp" data-caption="Entry pending: two passes are committed; the next exit is still required."><img src="assets/b964d820a08fe6.webp" width="480" height="270" alt="Entry pending: two passes are committed; the next exit is still required." loading="lazy"></button></div><figcaption>Entry pending: two passes are committed; the next exit is still required.</figcaption></figure><figure class="figure " data-media="clothExit"><div class="picture"><button aria-label="Enlarge: Exit accepted: a third pass joins the same cloth fold." data-story-image="assets/a48568b6e3545e.webp" data-caption="Exit accepted: a third pass joins the same cloth fold."><img src="assets/a48568b6e3545e.webp" width="480" height="270" alt="Exit accepted: a third pass joins the same cloth fold." loading="lazy"></button></div><figcaption>Exit accepted: a third pass joins the same cloth fold.</figcaption></figure></div><p class="">The entry and exit are stored in the repair surface’s local frame. A hit on the deformed doll is mapped back into that original frame, so filling or posing does not change the meaning of a stored stitch. Finite coordinates, separation and region checks run before the count advances.</p><p class="">A preview is separate from a committed stitch. Cancelling halfway through removes the preview while retaining accepted stitches. Input is gated while the needle or camera is moving, preventing a second click from skipping the physical sequence.</p><div class="screens two"><figure class="figure " data-media="pandaNeedlePending"><div class="picture"><button aria-label="Enlarge: Pending entry: an exit is still required." data-story-image="assets/cef496cd84d1d8.webp" data-caption="Pending entry: an exit is still required."><img src="assets/cef496cd84d1d8.webp" width="1920" height="1080" alt="Pending entry: an exit is still required." loading="lazy"></button></div><figcaption>Pending entry: an exit is still required.</figcaption></figure><figure class="figure " data-media="pandaNeedleCancelled"><div class="picture"><button aria-label="Enlarge: Cancel: the pending pass clears without deleting confirmed work." data-story-image="assets/c09a5d0fc21dcf.webp" data-caption="Cancel: the pending pass clears without deleting confirmed work."><img src="assets/c09a5d0fc21dcf.webp" width="1920" height="1080" alt="Cancel: the pending pass clears without deleting confirmed work." loading="lazy"></button></div><figcaption>Cancel: the pending pass clears without deleting confirmed work.</figcaption></figure></div></div><div class=""><h3>Working Thread</h3><figure class="diagram"><svg viewBox="0 0 720 225" role="img" aria-label="Live thread nodes, constraints and rendered tube"><path d="M30 149H280" stroke="#aeb7a5" stroke-width="27"></path><path d="M64 149C138 235 210 202 250 149C280 89 347 55 425 87S542 166 642 93" stroke="#8c6c45" fill="none" stroke-width="5"></path><g fill="#537051"><circle cx="64" cy="149" r="5"></circle><circle cx="94" cy="176" r="5"></circle><circle cx="139" cy="193" r="5"></circle><circle cx="184" cy="192" r="5"></circle><circle cx="224" cy="171" r="5"></circle><circle cx="250" cy="149" r="5"></circle><circle cx="278" cy="108" r="5"></circle><circle cx="320" cy="81" r="5"></circle><circle cx="366" cy="72" r="5"></circle><circle cx="412" cy="82" r="5"></circle><circle cx="455" cy="103" r="5"></circle><circle cx="498" cy="123" r="5"></circle><circle cx="544" cy="133" r="5"></circle><circle cx="591" cy="124" r="5"></circle><circle cx="642" cy="93" r="5"></circle></g><circle cx="64" cy="149" r="9" fill="#9a6145"></circle><circle cx="642" cy="93" r="9" fill="#9a6145"></circle><path d="M626 98L682 75" stroke="#818b8c" stroke-width="5"></path><text x="18" y="26" class="label">Cloth exit</text><path d="M65 35V130" stroke="#7d897a"></path><text x="260" y="26" class="label">28 simulated nodes</text><text x="515" y="26" class="label">Needle / held endpoint</text><path d="M641 36V75" stroke="#7d897a"></path><text x="274" y="190" class="small">Length + bending + cloth clearance</text><text x="274" y="214" class="small">82 render samples · six-sided tube</text></svg><figcaption>Schematic of the working thread. Both endpoints are pinned; intermediate nodes respond to gravity and constraints.</figcaption></figure><p class="">The loose thread uses 28 Verlet / position-based nodes with pinned endpoints, bounded substeps, gravity, length and bending constraints. Cloth clearance keeps the visible strand outside the configured repair surface. The result is resampled into 82 render points with a six-sided tube.</p><p class="">The cloth exit and needle or held end drive the simulation. Cutting changes the working tail; tension closes the seam; the knot and final trim resolve the remaining thread. This is a constrained repair visual, with no general rope self-collision system.</p><div class="screens three"><figure class="figure " data-media="clothCut"><div class="picture"><button aria-label="Enlarge: After cutting the working tail." data-story-image="assets/5f8be7aa1a9b82.webp" data-caption="After cutting the working tail."><img src="assets/5f8be7aa1a9b82.webp" width="1920" height="1080" alt="After cutting the working tail." loading="lazy"></button></div><figcaption>After cutting the working tail.</figcaption></figure><figure class="figure " data-media="clothKnot"><div class="picture"><button aria-label="Enlarge: After tension and knot confirmation." data-story-image="assets/1f16375ae747b9.webp" data-caption="After tension and knot confirmation."><img src="assets/1f16375ae747b9.webp" width="1920" height="1080" alt="After tension and knot confirmation." loading="lazy"></button></div><figcaption>After tension and knot confirmation.</figcaption></figure><figure class="figure " data-media="clothTrim"><div class="picture"><button aria-label="Enlarge: After the final trim." data-story-image="assets/836be15abd919f.webp" data-caption="After the final trim."><img src="assets/836be15abd919f.webp" width="1920" height="1080" alt="After the final trim." loading="lazy"></button></div><figcaption>After the final trim.</figcaption></figure></div></div></div><div class="grid two row-rule"><div class=""><h3>Tension</h3><figure class="figure " data-media="aliceTension"><div class="picture"><button aria-label="Enlarge: The pull must settle inside the accepted band before release." data-story-image="assets/16671ea140ec74.webp" data-caption="The pull must settle inside the accepted band before release."><img src="assets/16671ea140ec74.webp" width="1920" height="1080" alt="The pull must settle inside the accepted band before release." loading="lazy"></button></div><figcaption>The pull must settle inside the accepted band before release.</figcaption></figure><p class="">Pull distance controls the tension value; speed detects a sharp yank. In Alice’s standard gesture, the valid band is 0.72–0.88 and must remain stable for 0.28 seconds. A tap adds no tension. Pulling too far or too fast asks the player to ease back and settle rather than discarding the repair.</p><p class="">The click alternative starts a gentle pull and then waits for a separate confirmation. Relaxed craft limits the gesture while retaining the same completion gate.</p><pre class="code"><code>withinBand = value &gt;= 0.72f &amp;&amp; value &lt;= 0.88f;
ready = withinBand &amp;&amp; stableTime &gt;= 0.28f &amp;&amp; !tooFast;</code></pre><p class="source">Rule summary · AliceThreadTension.cs</p></div><div class=""><h3>Loop Recovery</h3><figure class="figure " data-media="pandaLoops"><div class="picture"><button aria-label="Enlarge: Panda’s loose-row recovery: align the tool with a live loop, then confirm." data-story-image="assets/2b5e770d546ef2.webp" data-caption="Panda’s loose-row recovery: align the tool with a live loop, then confirm."><img src="assets/2b5e770d546ef2.webp" width="1920" height="1080" alt="Panda’s loose-row recovery: align the tool with a live loop, then confirm." loading="lazy"></button></div><figcaption>Panda’s loose-row recovery: align the tool with a live loop, then confirm.</figcaption></figure><p class="">The hook must meet the loop horizontally, vertically and at a controlled speed. Six recovered rows form a longer sequence, and later rows move faster. Missing the opening leaves the current row available to retry; accepted rows remain recorded.</p><pre class="code"><code>public bool CanCatch =&gt; Active
    &amp;&amp; Mathf.Abs(LoopX - ToolX) &lt; .075f
    &amp;&amp; Mathf.Abs(Height - LoopY) &lt; Aperture * .76f
    &amp;&amp; Mathf.Abs(Speed) &lt; .60f;</code></pre><p class="source">WorkshopLoopGame.cs · alignment gate</p><p class="">Discrete input holds the aligned condition until the player confirms it. The same target is used, with timing pressure removed.</p></div></div><div class="grid two row-rule"><div class=""><h3>Button Holes</h3><div class="screens two"><figure class="figure " data-media="buttonBook"><div class="picture"><button aria-label="Enlarge: The four-hole lesson explains pair structure." data-story-image="assets/d8a0f2c331a4d5.webp" data-caption="The four-hole lesson explains pair structure."><img src="assets/d8a0f2c331a4d5.webp" width="1920" height="1080" alt="The four-hole lesson explains pair structure." loading="lazy"></button></div><figcaption>The four-hole lesson explains pair structure.</figcaption></figure><figure class="figure " data-media="aliceButton"><div class="picture"><button aria-label="Enlarge: Committed crosses pass through the modelled apertures." data-story-image="assets/8c021e46bf8207.webp" data-caption="Committed crosses pass through the modelled apertures."><img src="assets/8c021e46bf8207.webp" width="1920" height="1080" alt="Committed crosses pass through the modelled apertures." loading="lazy"></button></div><figcaption>Committed crosses pass through the modelled apertures.</figcaption></figure></div><p class="">A two-hole button needs one pair of four passes; a four-hole button needs two pairs, eight passes in total. The first valid pair establishes the available parallel or cross arrangement. Two distinct real apertures are required; clicking the same hole or missing the button does not add a stitch.</p><p class="">Thread colour, button selection and hole-pair structure affect the visible result. They share the preparation and finishing rules already introduced during the cloth repair.</p></div><div class=""><h3>Feedback &amp; Access</h3><div class="table-wrap"><table><thead><tr><th scope="col">Player situation</th><th scope="col">Response</th><th scope="col">State effect</th></tr></thead><tbody><tr><td>Wrong region or repeated hole</td><td>Local feedback identifies the required surface or aperture.</td><td>No stitch is committed.</td></tr><tr><td>Half-finished pass</td><td>Cancel clears the pending needle path.</td><td>Previously confirmed stitches remain.</td></tr><tr><td>Fast or excessive pull</td><td>Ease back and hold steadily.</td><td>The current tension step stays open.</td></tr><tr><td>Missed loop</td><td>Align the tool and retry this row.</td><td>Completed rows remain recorded.</td></tr></tbody></table></div><div class="access-layout subsection"><p class="">Local highlights follow real holes, cloth edges and tool handles. Mouse and discrete confirmation reach the same action logic. Remapping, 100% / 125% / 150% text scale, hint history, reduced motion and relaxed craft support different input and reading needs.</p><figure class="figure " data-media="accessibility"><div class="picture"><button aria-label="Enlarge: English accessibility controls. Input alternatives preserve the repair sequence." data-story-image="assets/b7575e0c022e3c.webp" data-caption="English accessibility controls. Input alternatives preserve the repair sequence."><img src="assets/b7575e0c022e3c.webp" width="1920" height="1080" alt="English accessibility controls. Input alternatives preserve the repair sequence." loading="lazy"></button></div><figcaption>English accessibility controls. Input alternatives preserve the repair sequence.</figcaption></figure></div></div></div><section class="evidence"><h3>Implementation notes</h3><ul><li>WorkshopFreeSewingState / WorkshopButtonSewing: entry/exit validation and confirmed stitch records.</li><li>AliceSewingThread / AliceContinuousThreadPresentation: constrained live thread and rendered path.</li><li>AliceThreadTension / WorkshopLoopGame: completion gates and recoverable gestures.</li><li>AliceAccessibleRepair / AliceAccessibleHighlight: shared action targets and local geometry emphasis.</li></ul></section></details>
<details id="report-character"><summary id="report-heading-character">Character</summary><div class="grid two"><div class=""><h3>Form &amp; Preparation</h3><div class="grid" style="grid-template-columns:.48fr 1fr"><figure class="figure " data-media="alicePhysical"><div class="picture"><button aria-label="Enlarge: Physical doll reference: proportions, hair mass, clothing and button placement." data-story-image="assets/685be954c5d831.webp" data-caption="Physical doll reference: proportions, hair mass, clothing and button placement."><img src="assets/685be954c5d831.webp" width="1280" height="1707" alt="Physical doll reference: proportions, hair mass, clothing and button placement." loading="lazy"></button></div><figcaption>Physical doll reference: proportions, hair mass, clothing and button placement.</figcaption></figure><div class="stack"><figure class="figure " data-media="clay"><div class="picture"><button aria-label="Enlarge: Prepared model in the current workshop lighting." data-story-image="assets/d38bcabf771bb1.webp" data-caption="Prepared model in the current workshop lighting."><img src="assets/d38bcabf771bb1.webp" width="1920" height="1200" alt="Prepared model in the current workshop lighting." loading="lazy"></button></div><figcaption>Prepared model in the current workshop lighting.</figcaption></figure><p class="">The physical doll establishes the head-to-body ratio, button-eye placement, hair volume and clothing silhouette. The digital preparation preserves the original visible form while making the mesh suitable for close inspection, filling and pose changes.</p></div></div><p class="">The volume review retained the original 2,384 skin triangles, closed 184 open garment edges and welded shared boundaries. Weight transitions at cuffs and waist were smoothed so seated and waving poses did not expose gaps. Six presentation poses were checked alongside the repair view.</p></div><div class=""><h3>Doll Models and Materials</h3><div class="screens two doll-originals"><figure class="figure " data-media="aliceModelFront"><div class="picture"><button aria-label="Enlarge: Alice with her yarn hair, black button eyes and blue ribbon." data-story-image="assets/alice-model-front.webp" data-caption="Alice with her yarn hair, black button eyes and blue ribbon."><img src="assets/alice-model-front.webp" width="1440" height="1440" alt="Alice with her yarn hair, black button eyes and blue ribbon." loading="lazy"></button></div><figcaption>Alice with her yarn hair, black button eyes and blue ribbon.</figcaption></figure><figure class="figure " data-media="pandaModelFront"><div class="picture"><button aria-label="Enlarge: Panda with the birthday crown and cheek sequins." data-story-image="assets/panda-model-front.webp" data-caption="Panda with the birthday crown and cheek sequins."><img src="assets/panda-model-front.webp" width="1600" height="1600" alt="Panda with the birthday crown and cheek sequins." loading="lazy"></button></div><figcaption>Panda with the birthday crown and cheek sequins.</figcaption></figure></div><p class="">The face remains broad and readable while hair carries a stronger yarn structure. Clothing uses distinct cloth and binding regions. Thread diameter, seam contrast and local camera distance are coordinated so a valid stitch can be read against the underlying weave.</p><p class="">Material regions also separate what the repair changes. Filling affects volume; the seam closes the tear; button geometry and thread show the selected eye. These results are represented independently rather than baked into one final texture.</p></div></div><div class="grid two row-rule"><div class=""><h3>Volume Response</h3><div class="screens two"><figure class="figure " data-media="fill0"><div class="picture"><button aria-label="Enlarge: Empty state." data-story-image="assets/c971122a534224.webp" data-caption="Empty state."><img src="assets/c971122a534224.webp" width="1920" height="1200" alt="Empty state." loading="lazy"></button></div><figcaption>Empty state.</figcaption></figure><figure class="figure " data-media="fill100"><div class="picture"><button aria-label="Enlarge: Four cotton portions, under the same camera and lighting." data-story-image="assets/ba937657d8164c.webp" data-caption="Four cotton portions, under the same camera and lighting."><img src="assets/ba937657d8164c.webp" width="1920" height="1200" alt="Four cotton portions, under the same camera and lighting." loading="lazy"></button></div><figcaption>Four cotton portions, under the same camera and lighting.</figcaption></figure></div><p class="">A shape-specific mesh deformation, skeleton and low-resolution volume proxy control the plush response. Head volume grows mainly toward the back, protecting the face, eye position and repair anchors. Packing redistributes the existing filling instead of adding another portion.</p><p class="">This focused model gives a controllable response to the configured repair states. It does not simulate every cloth fibre or solve unrestricted soft-body physics.</p></div><div class=""><h3>Repair Coordinates</h3><div class="flow" style="--steps:3"><div><b>Contact</b><span>Raycast the visible, deformed surface.</span></div><div><b>Local record</b><span>Map the hit into the undeformed repair frame.</span></div><div><b>Presentation</b><span>Evaluate the stored stitch on the current shape and pose.</span></div></div><p class="">The same mapping supports a stable seam while the head fills and the character moves. Confirmed entry/exit records remain unchanged; their visible positions are rebuilt through the current repair transform. Needle animation and thread endpoints use that same reference.</p><div class="screens two"><figure class="figure " data-media="meshWireframe"><div class="picture"><button aria-label="Enlarge: Prepared mesh: the visible form and garment boundaries." data-story-image="assets/499bcc58438146.webp" data-caption="Prepared mesh: the visible form and garment boundaries."><img src="assets/499bcc58438146.webp" width="1920" height="1200" alt="Prepared mesh: the visible form and garment boundaries." loading="lazy"></button></div><figcaption>Prepared mesh: the visible form and garment boundaries.</figcaption></figure><figure class="figure " data-media="aliceSeated"><div class="picture"><button aria-label="Enlarge: Return transition after the seated response." data-story-image="assets/55209878d5122e.webp" data-caption="Return transition after the seated response."><img src="assets/55209878d5122e.webp" width="1920" height="1080" alt="Return transition after the seated response." loading="lazy"></button></div><figcaption>Return transition after the seated response.</figcaption></figure></div></div></div><section class="evidence"><h3>Implementation notes</h3><ul><li>ModelVolumeReview-20261108: preserved topology, garment closure, seam and pose checks.</li><li>AlicePlushRig / AlicePlushCage: prepared mesh deformation and volume control.</li><li>AliceRepairVisuals / AliceFreeSewingVisuals: repair-frame conversion, needle paths and thread endpoints.</li></ul></section></details>
<details id="report-rendering"><summary id="report-heading-rendering">Rendering</summary><section class="window-study"><h3>Rain at the workshop window</h3><p id="report-window-sound">Rain at 13:00, recorded in the game with music off. With both windows open, the outdoor patter sounds brighter and closer. Closing just the glass muffles it again.</p><figure class="window-film"><video id="report-window-video" controls="" playsinline="" preload="none" poster="assets/workshop-rain-window.webp" aria-label="Rain at the workshop window" aria-describedby="report-window-sound"><source src="assets/workshop-rain-window.mp4" type="video/mp4"><a href="assets/workshop-rain-window.mp4">Rain at the workshop window</a></video><img class="window-print" src="assets/workshop-rain-window.webp" loading="lazy" alt="Rain at the workshop window"><figcaption><div class="window-cues" role="group" aria-label="Listen by window position"><button type="button" aria-controls="report-window-video" aria-label="Play · 0:00 · Both closed" data-window-cue="0"><span class="cue-time">0:00</span> Both closed</button><button type="button" aria-controls="report-window-video" aria-label="Play · 0:06 · Inner glass open" data-window-cue="6"><span class="cue-time">0:06</span> Inner glass open</button><button type="button" aria-controls="report-window-video" aria-label="Play · 0:12 · Both open" data-window-cue="12"><span class="cue-time">0:12</span> Both open</button><button type="button" aria-controls="report-window-video" aria-label="Play · 0:19 · Glass closed again" data-window-cue="19"><span class="cue-time">0:19</span> Glass closed again</button></div></figcaption></figure></section><section class="workshop-comparisons"><h3>Weather and time outside the window</h3><p>Click the wall clock to set the time in 15-minute steps and choose clear, overcast or rainy weather. The camera stays in place with both windows open so you can compare the shopfront light and its reflection on the paving.</p><section class="workshop-compare-row"><h4>Three kinds of weather at 14:00</h4><div class="workshop-views"><figure><a class="workshop-view" href="assets/workshop-weather-clear.webp" data-zoom="assets/workshop-weather-clear.webp" data-caption="Three kinds of weather at 14:00 · Clear" aria-label="Enlarge · Three kinds of weather at 14:00 · Clear"><img src="assets/workshop-weather-clear.webp" width="1440" height="1000" loading="lazy" alt="Three kinds of weather at 14:00 · Clear"></a><figcaption>Clear</figcaption></figure><figure><a class="workshop-view" href="assets/workshop-weather-overcast.webp" data-zoom="assets/workshop-weather-overcast.webp" data-caption="Three kinds of weather at 14:00 · Overcast" aria-label="Enlarge · Three kinds of weather at 14:00 · Overcast"><img src="assets/workshop-weather-overcast.webp" width="1440" height="1000" loading="lazy" alt="Three kinds of weather at 14:00 · Overcast"></a><figcaption>Overcast</figcaption></figure><figure><a class="workshop-view" href="assets/workshop-weather-rain.webp" data-zoom="assets/workshop-weather-rain.webp" data-caption="Three kinds of weather at 14:00 · Rain" aria-label="Enlarge · Three kinds of weather at 14:00 · Rain"><img src="assets/workshop-weather-rain.webp" width="1440" height="1000" loading="lazy" alt="Three kinds of weather at 14:00 · Rain"></a><figcaption>Rain</figcaption></figure></div></section><section class="workshop-compare-row"><h4>A clear afternoon into night</h4><div class="workshop-views"><figure><a class="workshop-view" href="assets/workshop-weather-clear.webp" data-zoom="assets/workshop-weather-clear.webp" data-caption="A clear afternoon into night · 14:00 · Afternoon" aria-label="Enlarge · A clear afternoon into night · 14:00 · Afternoon"><img src="assets/workshop-weather-clear.webp" width="1440" height="1000" loading="lazy" alt="A clear afternoon into night · 14:00 · Afternoon"></a><figcaption>14:00 · Afternoon</figcaption></figure><figure><a class="workshop-view" href="assets/workshop-time-sunset.webp" data-zoom="assets/workshop-time-sunset.webp" data-caption="A clear afternoon into night · 17:00 · Late afternoon" aria-label="Enlarge · A clear afternoon into night · 17:00 · Late afternoon"><img src="assets/workshop-time-sunset.webp" width="1440" height="1000" loading="lazy" alt="A clear afternoon into night · 17:00 · Late afternoon"></a><figcaption>17:00 · Late afternoon</figcaption></figure><figure><a class="workshop-view" href="assets/workshop-time-night.webp" data-zoom="assets/workshop-time-night.webp" data-caption="A clear afternoon into night · 22:00 · Night" aria-label="Enlarge · A clear afternoon into night · 22:00 · Night"><img src="assets/workshop-time-night.webp" width="1440" height="1000" loading="lazy" alt="A clear afternoon into night · 22:00 · Night"></a><figcaption>22:00 · Night</figcaption></figure></div></section></section><div class="grid two knit-study"><div class=""><h3>Panda Knit</h3><p class="">Panda’s knitted regions use a thin shell envelope over the current deforming mesh. The shader clips each layer by the knit height pattern and limits the contribution by surface orientation. The envelope follows tears, compression and ear motion because it draws the same private animated mesh.</p><p class="">Only the knit materials participate; resin accessories remain separate. Projected thickness determines visibility and a 4–12 layer count per visible surface. The volume fades between 1 and 1.8 pixels, leaving the normal detail at smaller screen sizes. Frustum culling and instancing avoid drawing every layer everywhere.</p></div><div class=""><h3>Distance &amp; Cost</h3><div class="flow" style="--steps:3"><div><b>Thickness</b><span>Convert material thickness into world space.</span></div><div><b>Projection</b><span>Estimate its pixel size at the current camera distance.</span></div><div><b>Draw</b><span>Fade subpixel volume; choose and instance the visible layers.</span></div></div><p class="">Close to the face, the knit layers give the eye patch a soft outline beside the smooth button. At a distance the extra layers fade, while the base fabric keeps its colour and weave.</p></div><div class="screens two"><figure class="figure " data-media="pandaModelQuarter"><div class="picture"><button aria-label="Enlarge: Panda in three-quarter view." data-story-image="assets/panda-model-quarter.webp" data-caption="Panda in three-quarter view."><img src="assets/panda-model-quarter.webp" width="1600" height="1600" alt="Panda in three-quarter view." loading="lazy"></button></div><figcaption>Panda in three-quarter view.</figcaption></figure><figure class="figure " data-media="pandaModelDetail"><div class="picture"><button aria-label="Enlarge: A smooth button eye and cheek sequin against the black and white knit." data-story-image="assets/panda-model-detail.webp" data-caption="A smooth button eye and cheek sequin against the black and white knit."><img src="assets/panda-model-detail.webp" width="1600" height="1600" alt="A smooth button eye and cheek sequin against the black and white knit." loading="lazy"></button></div><figcaption>A smooth button eye and cheek sequin against the black and white knit.</figcaption></figure></div></div><div class="grid two row-rule"><div class=""><h3>Surface Finish</h3><div class="screens two"><figure class="figure " data-media="hatchingOff"><div class="picture"><button aria-label="Enlarge: Detail crop · hatching disabled." data-story-image="assets/9d24abe003bd5e.webp" data-caption="Detail crop · hatching disabled."><img src="assets/9d24abe003bd5e.webp" width="528" height="330" alt="Detail crop · hatching disabled." loading="lazy"></button></div><figcaption>Detail crop · hatching disabled.</figcaption></figure><figure class="figure " data-media="hatchingOn"><div class="picture"><button aria-label="Enlarge: Same crop · authored hatching enabled." data-story-image="assets/bb262c0794bb38.webp" data-caption="Same crop · authored hatching enabled."><img src="assets/bb262c0794bb38.webp" width="528" height="330" alt="Same crop · authored hatching enabled." loading="lazy"></button></div><figcaption>Same crop · authored hatching enabled.</figcaption></figure></div><p class="">A fullscreen pass builds pencil-like strokes from image brightness. Different line directions enter progressively in darker values, with derivative smoothing and restrained paper grain. This treatment responds to luminance; it is not a depth- or normal-based edge detector.</p><p class="">The pass supports the drawn room and paper presentation while keeping the repair surface readable. Its strength is controlled independently of the textile materials.</p></div><div class=""><h3>Window Reflection</h3><div class="screens two"><figure class="figure " data-media="glassClosed"><div class="picture"><button aria-label="Enlarge: Inner glass closed; reflection lies on the current pane." data-story-image="assets/4e7e4ff3a5d630.webp" data-caption="Inner glass closed; reflection lies on the current pane."><img src="assets/4e7e4ff3a5d630.webp" width="1920" height="1200" alt="Inner glass closed; reflection lies on the current pane." loading="lazy"></button></div><figcaption>Inner glass closed; reflection lies on the current pane.</figcaption></figure><figure class="figure " data-media="glassOpen"><div class="picture"><button aria-label="Enlarge: Inner glass open; the reflection plane moves with the window." data-story-image="assets/252fee67c27dfb.webp" data-caption="Inner glass open; the reflection plane moves with the window."><img src="assets/252fee67c27dfb.webp" width="1920" height="1200" alt="Inner glass open; the reflection plane moves with the window." loading="lazy"></button></div><figcaption>Inner glass open; the reflection plane moves with the window.</figcaption></figure></div><p class="">Each pane reflects the observer camera across its current plane. An oblique clipping plane prevents geometry behind the glass from leaking into the reflected view. Per-observer textures, half-resolution rendering, a 1,024 px cap and a recursion guard bound the extra rendering work.</p><p class="">The reflection camera skips post-processing so the pane is not graded twice. The pane transform and observer projection determine the reflection rather than a flipped copy of the player’s screen.</p></div></div><div class="subsection"><h3>Asset Integration</h3><div class="flow" style="--steps:3"><div><b>Toolkit</b><span>Static mesh, material, textures and declared targets.</span></div><div><b>Game prefab</b><span>Keep pivots, colliders, tool anchors and placement points.</span></div><div><b>Runtime</b><span>Connect actions, camera framing, tutorials and saved state.</span></div></div></div><p class="">The work mat supports the repair surface; the organiser provides pickup points; the handbook opens technique lessons; the curtain retains its window placement; the sign keeps its take, hang and return actions. Visual replacement is tested together with those existing behaviours.</p><section class="evidence"><h3>Implementation notes</h3><ul><li>PandaKnitEnvelope.cs / PandaMelangeKnit.shader: current-mesh shell instancing, projection-based fade and clipped knit layers.</li><li>WorkshopAuthoredLighting.cs: original light values and a cloned volume profile.</li><li>AlicePencilHatching.shader: brightness-based stroke layers.</li><li>AlicePlanarGlassReflection.cs: reflected view, oblique clipping, resolution limits and recursion protection.</li></ul></section></details>
<details id="report-validation"><summary id="report-heading-validation">Validation</summary><div class="grid two"><div class=""><h3>State &amp; Restoration</h3><div class="flow" style="--steps:4"><div><b>Input</b><span>A tool gesture targets a local repair region.</span></div><div><b>Validation</b><span>Check stage, tool, geometry and completion conditions.</span></div><div><b>Checkpoint</b><span>Commit accepted actions and atomically replace the save.</span></div><div><b>Rebuild</b><span>Restore craft geometry, tools, checklist and story state.</span></div></div><p class="">Confirmed progress is durable; a pending drag or half stitch is temporary. Saves write to a temporary file, flush and replace the current file with backup and revision checks. Preferences are stored separately from repair progress.</p><p class="">Restoration reconstructs the visual state from confirmed data rather than relying on the previous frame. The test cases include needle cancellation, mid-seam reload, a finished commission and restoration of parcel phases.</p><pre class="code"><code>input → validated action → confirmed progress
                           ↓
                       save record
                           ↓
              geometry + tools + story phase</code></pre><p class="source">Runtime ownership · WorkshopSaveService and commission state</p></div><div class=""><h3>Checks</h3><div class="table-wrap"><table><thead><tr><th scope="col">Scope</th><th scope="col">Evidence</th></tr></thead><tbody><tr><td>Alice journey</td><td>Opening through dispatch; four cotton portions, cloth closure, four-hole fastening, finishing and completion reload.</td></tr><tr><td>Panda journey</td><td>Opening through dispatch; loop recovery, all three repairs, cancellation paths, mid-seam reload and three independent inspections.</td></tr><tr><td>Rendering</td><td>Current English captures; Edit / Play parity and controlled knit, hatching and glass comparisons.</td></tr><tr><td>Character</td><td>Garment seams, repair anchors, filling and seated / waving presentation.</td></tr><tr><td>Input</td><td>Mouse paths and discrete actions; bilingual accessibility checks. Controller checks used virtual input.</td></tr></tbody></table></div><p class="">The current runtime baseline is macOS with Unity 6.3 / URP 17.3. Automated action and assertion counts describe specific scripted runs, not participant studies, hardware-controller coverage or performance benchmarks.</p></div></div><div class="subsection"><h3>Iteration</h3><div class="table-wrap"><table><thead><tr><th scope="col">Issue</th><th scope="col">Resolution</th><th scope="col">Result to inspect</th></tr></thead><tbody><tr><td>Edit / Play appearance changed</td><td>Preserve authored light and volume values; apply relative atmosphere changes.</td><td>Evening and rainy night views in Rendering.</td></tr><tr><td>Garment gaps during presentation</td><td>Close open edges, weld shared seams and smooth weight transitions.</td><td>Prepared form and completion transition in Character.</td></tr><tr><td>Repair progress and visible thread diverged</td><td>Separate pending gestures from accepted local records.</td><td>Entry / exit, cancellation and final trimming in Interaction.</td></tr><tr><td>Panda details were shown only from stage checkpoints</td><td>Capture a complete isolated commission and reload its final state.</td><td>Independent final inspections, response and dispatch.</td></tr></tbody></table></div></div><section class="evidence"><h3>Implementation notes</h3><ul><li>PortfolioVerticalReview-20261113/Game/validation.json: Alice journey and completion reload.</li><li>PortfolioVerticalReview-20261113/Panda/validation.json: Panda journey, cancellation and restoration.</li><li>ModelVolumeReview / LightingParityReview / RuntimeRecoveryReview: scoped regression evidence.</li><li>AccessibilityReview: bilingual actions and virtual controller-input checks.</li></ul></section><p class="inline-links"><a href="#overview">Full game documentation →</a><a href="toolkit.html#technical-report">Alice Textile Studio →</a><a href="credits.txt">Asset and music credits →</a></p></details></template><div id="app"></div><noscript>请启用 JavaScript 浏览游戏制作与机制演示。Please enable JavaScript to view this portfolio.</noscript><script defer src="personal-media.js"></script><script defer src="personal-shell.js?v=4ef9630b8a"></script></body></html>
